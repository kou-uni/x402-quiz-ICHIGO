id: v1
title: Web3AI概論 — AI体験ミニアンケート
intro: |
  あなたのAIエージェントとの関わり方について、5問だけ聞かせてください。
  すべて自由記述です。実質的な回答であれば長さは問いません。
outro: |
  ご回答ありがとうございました。
  500 ICHIGO を treasury からあなたのウォレットへ送ります。
questions:
  - id: q1
    prompt: 最近、AI（ChatGPT / Claude / Gemini 等）を使って実際にやったことを1つ、具体的に教えてください。
    minLength: 20
  - id: q2
    prompt: そのとき、AIに任せて良かったことと、自分でやるべきだったと思ったことを、それぞれ1つずつ挙げてください。
    minLength: 30
  - id: q3
    prompt: AIエージェントが自律的にお金を使う未来について、あなたは賛成ですか／反対ですか？理由も一文で。
    minLength: 20
  - id: q4
    prompt: Web3AI概論の同期受講生やキャストから学んだ／影響を受けたことが既にあれば教えてください（無ければ「まだ無い」でも可）。
    minLength: 5
  - id: q5
    prompt: 残り13週間で、あなた自身がAIを使って実現したいことを一文で。
    minLength: 15
